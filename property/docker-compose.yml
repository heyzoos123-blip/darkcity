version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: darkcity_property
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-darkcity_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: darkcity_property
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-darkcity_secret}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS}
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped

  scheduler:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: darkcity_property
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-darkcity_secret}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS}
    command: ["node", "dist/services/rent-scheduler.js"]
    restart: unless-stopped

volumes:
  postgres_data:
