<?xml version="1.0" encoding="UTF-8"?>
<!-- Gothic Pattern Library for DARKCITY -->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">

  <!-- Filigree Border Pattern -->
  <pattern id="filigree-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M0,20 Q10,10 20,20 T40,20" 
          stroke="#d4af37" fill="none" stroke-width="1" opacity="0.6"/>
    <path d="M0,20 Q10,30 20,20 T40,20" 
          stroke="#d4af37" fill="none" stroke-width="1" opacity="0.6"/>
    <circle cx="20" cy="20" r="2" fill="#d4af37" opacity="0.4"/>
  </pattern>

  <!-- Stone Texture -->
  <pattern id="stone-texture" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="#2d1b4e"/>
    <path d="M0,30 L100,30 M0,60 L100,60" stroke="#3d2a1f" stroke-width="2" opacity="0.4"/>
    <path d="M25,0 L25,100 M50,0 L50,100 M75,0 L75,100" 
          stroke="#3d2a1f" stroke-width="2" opacity="0.3"/>
    <circle cx="25" cy="30" r="1" fill="#d4af37" opacity="0.2"/>
    <circle cx="50" cy="60" r="1" fill="#d4af37" opacity="0.2"/>
    <circle cx="75" cy="30" r="1" fill="#d4af37" opacity="0.2"/>
  </pattern>

  <!-- Iron Grate Pattern -->
  <pattern id="iron-grate" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <rect width="20" height="20" fill="transparent"/>
    <line x1="0" y1="10" x2="20" y2="10" stroke="#3d2a1f" stroke-width="2"/>
    <line x1="10" y1="0" x2="10" y2="20" stroke="#3d2a1f" stroke-width="2"/>
    <circle cx="10" cy="10" r="1.5" fill="#d4af37" opacity="0.6"/>
  </pattern>

  <!-- Ornate Corner (Top-Left) -->
  <symbol id="corner-ornament-tl" viewBox="0 0 40 40">
    <path d="M0,40 L0,10 Q0,0 10,0 L40,0" 
          stroke="#d4af37" fill="none" stroke-width="2"/>
    <path d="M0,35 L0,12 Q0,5 7,5 L35,5" 
          stroke="#8b0000" fill="none" stroke-width="1" opacity="0.6"/>
    <circle cx="10" cy="10" r="2" fill="#d4af37"/>
    <path d="M5,5 L10,10 L15,5" stroke="#d4af37" fill="none" stroke-width="1"/>
  </symbol>

  <!-- Ornate Corner (Top-Right) -->
  <symbol id="corner-ornament-tr" viewBox="0 0 40 40">
    <path d="M40,40 L40,10 Q40,0 30,0 L0,0" 
          stroke="#d4af37" fill="none" stroke-width="2"/>
    <path d="M40,35 L40,12 Q40,5 33,5 L5,5" 
          stroke="#8b0000" fill="none" stroke-width="1" opacity="0.6"/>
    <circle cx="30" cy="10" r="2" fill="#d4af37"/>
    <path d="M35,5 L30,10 L25,5" stroke="#d4af37" fill="none" stroke-width="1"/>
  </symbol>

  <!-- Ornate Corner (Bottom-Left) -->
  <symbol id="corner-ornament-bl" viewBox="0 0 40 40">
    <path d="M0,0 L0,30 Q0,40 10,40 L40,40" 
          stroke="#d4af37" fill="none" stroke-width="2"/>
    <path d="M0,5 L0,28 Q0,35 7,35 L35,35" 
          stroke="#8b0000" fill="none" stroke-width="1" opacity="0.6"/>
    <circle cx="10" cy="30" r="2" fill="#d4af37"/>
    <path d="M5,35 L10,30 L15,35" stroke="#d4af37" fill="none" stroke-width="1"/>
  </symbol>

  <!-- Ornate Corner (Bottom-Right) -->
  <symbol id="corner-ornament-br" viewBox="0 0 40 40">
    <path d="M40,0 L40,30 Q40,40 30,40 L0,40" 
          stroke="#d4af37" fill="none" stroke-width="2"/>
    <path d="M40,5 L40,28 Q40,35 33,35 L5,35" 
          stroke="#8b0000" fill="none" stroke-width="1" opacity="0.6"/>
    <circle cx="30" cy="30" r="2" fill="#d4af37"/>
    <path d="M35,35 L30,30 L25,35" stroke="#d4af37" fill="none" stroke-width="1"/>
  </symbol>

  <!-- Gothic Arch -->
  <symbol id="gothic-arch" viewBox="0 0 100 120">
    <path d="M10,120 L10,40 Q10,20 30,10 Q50,0 50,0 Q50,0 70,10 Q90,20 90,40 L90,120" 
          fill="none" stroke="#d4af37" stroke-width="3"/>
    <path d="M15,120 L15,42 Q15,24 32,14 Q50,5 50,5 Q50,5 68,14 Q85,24 85,42 L85,120" 
          fill="rgba(139, 0, 0, 0.1)" stroke="#8b0000" stroke-width="1"/>
  </symbol>

  <!-- Cobblestone Pattern -->
  <pattern id="cobblestone" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
    <rect width="60" height="60" fill="#12091a"/>
    <!-- Irregular stones -->
    <ellipse cx="10" cy="10" rx="8" ry="6" fill="#3d2a1f" opacity="0.7"/>
    <ellipse cx="30" cy="8" rx="10" ry="7" fill="#3d2a1f" opacity="0.8"/>
    <ellipse cx="50" cy="12" rx="7" ry="8" fill="#3d2a1f" opacity="0.6"/>
    <ellipse cx="15" cy="30" rx="9" ry="7" fill="#3d2a1f" opacity="0.75"/>
    <ellipse cx="40" cy="32" rx="11" ry="6" fill="#3d2a1f" opacity="0.8"/>
    <ellipse cx="10" cy="50" rx="8" ry="7" fill="#3d2a1f" opacity="0.7"/>
    <ellipse cx="35" cy="52" rx="9" ry="8" fill="#3d2a1f" opacity="0.65"/>
    <ellipse cx="52" cy="48" rx="7" ry="6" fill="#3d2a1f" opacity="0.8"/>
    <!-- Mortar lines -->
    <line x1="0" y1="20" x2="60" y2="22" stroke="#0a0a14" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="42" x2="60" y2="40" stroke="#0a0a14" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="0" x2="22" y2="60" stroke="#0a0a14" stroke-width="1" opacity="0.5"/>
    <line x1="45" y1="0" x2="43" y2="60" stroke="#0a0a14" stroke-width="1" opacity="0.5"/>
  </pattern>

  <!-- Parchment Texture -->
  <pattern id="parchment-texture" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
    <rect width="200" height="200" fill="#e8dcc4"/>
    <rect width="200" height="200" fill="url(#parchment-noise)"/>
  </pattern>

  <!-- Noise filter for parchment -->
  <filter id="parchment-noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="discrete" tableValues="0 0.05"/>
    </feComponentTransfer>
  </filter>

  <!-- Wrought Iron Scroll -->
  <symbol id="iron-scroll" viewBox="0 0 100 30">
    <path d="M5,15 Q15,5 25,15 T45,15 T65,15 T85,15 Q95,5 95,15" 
          stroke="#3d2a1f" fill="none" stroke-width="3"/>
    <circle cx="5" cy="15" r="3" fill="#d4af37" opacity="0.6"/>
    <circle cx="25" cy="15" r="2" fill="#d4af37" opacity="0.6"/>
    <circle cx="45" cy="15" r="2" fill="#d4af37" opacity="0.6"/>
    <circle cx="65" cy="15" r="2" fill="#d4af37" opacity="0.6"/>
    <circle cx="85" cy="15" r="2" fill="#d4af37" opacity="0.6"/>
    <circle cx="95" cy="15" r="3" fill="#d4af37" opacity="0.6"/>
  </symbol>

</svg>
