<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARKCITY - 3D Combat Arena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --void-black: #0A0A0A;
            --void-deep: #121212;
            --blood-fresh: #8B0000;
            --blood-glow: #FF1744;
            --text-primary: #E0E0E0;
            --text-secondary: #9E9E9E;
        }

        body {
            font-family: 'Rajdhani', monospace;
            background: var(--void-black);
            color: var(--text-primary);
            overflow: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .hud {
            pointer-events: auto;
            position: absolute;
        }

        .header {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .header h1 {
            font-size: 3em;
            font-weight: 700;
            letter-spacing: 12px;
            color: var(--text-primary);
            text-shadow: 
                0 0 20px var(--blood-glow),
                0 4px 0 var(--blood-fresh);
        }

        .agent-hud {
            top: 100px;
            width: 300px;
            background: rgba(18, 18, 18, 0.9);
            border: 3px solid var(--blood-fresh);
            padding: 15px;
            border-radius: 4px;
        }

        .agent-hud.left { left: 20px; }
        .agent-hud.right { right: 20px; }

        .agent-name {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--blood-glow);
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--blood-glow);
        }

        .health-bar {
            height: 25px;
            background: var(--void-black);
            border: 2px solid var(--blood-fresh);
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blood-fresh), var(--blood-glow));
            transition: width 0.3s ease;
            box-shadow: 0 0 15px var(--blood-glow);
        }

        .health-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 700;
            font-size: 1.1em;
            text-shadow: 0 0 5px #000;
        }

        .stats {
            display: grid;
            gap: 5px;
            font-size: 1em;
            margin-top: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
        }

        .stat-label {
            color: var(--text-secondary);
        }

        .stat-value {
            color: var(--blood-glow);
            font-weight: 700;
        }

        .combat-log {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            max-height: 150px;
            background: rgba(18, 18, 18, 0.95);
            border: 2px solid var(--blood-fresh);
            border-radius: 4px;
            padding: 10px;
            overflow-y: auto;
        }

        .log-entry {
            margin: 3px 0;
            padding: 5px;
            font-size: 0.95em;
            border-left: 3px solid var(--blood-fresh);
            padding-left: 8px;
        }

        .log-entry.kill {
            color: var(--blood-glow);
            font-weight: 700;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }

        button {
            background: linear-gradient(180deg, var(--blood-fresh), var(--void-deep));
            border: 3px solid var(--blood-fresh);
            color: var(--text-primary);
            padding: 12px 30px;
            font-size: 1.2em;
            font-family: 'Rajdhani', monospace;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.4);
        }

        button:hover {
            background: linear-gradient(180deg, var(--blood-glow), var(--blood-fresh));
            box-shadow: 0 0 40px var(--blood-glow);
            transform: translateY(-2px);
        }

        .winner-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, var(--void-black), var(--void-deep));
            border: 6px solid var(--blood-glow);
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 100px var(--blood-glow);
            min-width: 500px;
        }

        .winner-banner h2 {
            font-size: 3em;
            color: var(--blood-glow);
            text-shadow: 0 0 30px var(--blood-glow);
            margin-bottom: 20px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--void-black);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--blood-fresh);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-overlay">
        <div class="hud header">
            <h1>DARKCITY</h1>
        </div>

        <div class="hud agent-hud left">
            <div class="agent-name" id="agent1Name">AGGRESSOR</div>
            <div class="health-bar">
                <div class="health-fill" id="agent1Health" style="width: 100%"></div>
                <div class="health-text" id="agent1HealthText">100%</div>
            </div>
            <div class="stats">
                <div class="stat-row">
                    <span class="stat-label">KILLS</span>
                    <span class="stat-value" id="agent1Kills">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">DAMAGE</span>
                    <span class="stat-value" id="agent1Damage">0%</span>
                </div>
            </div>
        </div>

        <div class="hud agent-hud right">
            <div class="agent-name" id="agent2Name">DEFENDER</div>
            <div class="health-bar">
                <div class="health-fill" id="agent2Health" style="width: 100%"></div>
                <div class="health-text" id="agent2HealthText">100%</div>
            </div>
            <div class="stats">
                <div class="stat-row">
                    <span class="stat-label">KILLS</span>
                    <span class="stat-value" id="agent2Kills">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">DAMAGE</span>
                    <span class="stat-value" id="agent2Damage">0%</span>
                </div>
            </div>
        </div>

        <div class="hud combat-log" id="combatLog">
            <div class="log-entry">SYSTEM: 3D Combat Arena initialized.</div>
        </div>

        <div class="hud controls">
            <button onclick="arena.startBattle()">START BATTLE</button>
            <button onclick="arena.reset()">RESET</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="combat-v2.js"></script>
    <script src="dungeon.js"></script>
</body>
</html>
