<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARKCITY - Combat Arena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --void-black: #0A0A0A;
            --void-deep: #121212;
            --void-medium: #1A1A1A;
            --void-light: #242424;
            --blood-fresh: #8B0000;
            --blood-glow: #FF1744;
            --decay-rust: #4A3328;
            --decay-copper: #6D4C41;
            --rot-green: #1B5E20;
            --rot-glow: #00E676;
            --text-primary: #E0E0E0;
            --text-secondary: #9E9E9E;
        }

        body {
            font-family: 'Rajdhani', monospace;
            background: var(--void-black);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .header {
            text-align: center;
            border-bottom: 3px solid var(--blood-fresh);
            padding-bottom: 15px;
            position: relative;
        }

        .header h1 {
            font-size: 4em;
            font-weight: 700;
            letter-spacing: 16px;
            color: var(--text-primary);
            text-shadow: 
                0 0 20px var(--blood-glow),
                0 0 40px var(--blood-glow),
                0 4px 0 var(--blood-fresh);
            animation: title-glitch 3s infinite;
        }

        @keyframes title-glitch {
            0%, 90%, 100% { 
                text-shadow: 
                    0 0 20px var(--blood-glow),
                    0 0 40px var(--blood-glow),
                    0 4px 0 var(--blood-fresh);
            }
            92%, 94%, 96% { 
                text-shadow: 
                    2px 0 0 var(--blood-glow),
                    -2px 0 0 var(--rot-glow),
                    0 4px 0 var(--blood-fresh);
            }
        }

        .subtitle {
            color: var(--blood-glow);
            font-size: 1.4em;
            letter-spacing: 6px;
            margin-top: 10px;
            font-weight: 600;
        }

        .arena {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 20px;
            position: relative;
        }

        .agent-panel {
            background: linear-gradient(180deg, var(--void-deep), var(--void-medium));
            border: 3px solid var(--decay-rust);
            border-radius: 4px;
            padding: 20px;
            position: relative;
            box-shadow: 
                inset 0 0 40px rgba(139, 0, 0, 0.2),
                0 0 30px rgba(0, 0, 0, 0.8);
        }

        .agent-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--blood-fresh), transparent);
        }

        .agent-panel h2 {
            color: var(--blood-glow);
            text-align: center;
            margin-bottom: 20px;
            font-size: 2em;
            font-weight: 700;
            text-shadow: 0 0 15px var(--blood-glow);
            letter-spacing: 4px;
        }

        .stat-bar {
            margin: 15px 0;
        }

        .stat-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 1.1em;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .stat-label .value {
            color: var(--blood-glow);
            font-weight: 700;
        }

        .bar {
            height: 30px;
            background: var(--void-black);
            border: 2px solid var(--decay-rust);
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blood-fresh), var(--blood-glow));
            transition: width 0.5s ease;
            box-shadow: 
                0 0 20px var(--blood-glow),
                inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .stats-grid {
            margin-top: 20px;
            display: grid;
            gap: 10px;
            font-size: 1.1em;
            font-weight: 600;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            background: var(--void-black);
            border-left: 3px solid var(--decay-rust);
        }

        .stat-row .label {
            color: var(--text-secondary);
        }

        .stat-row .value {
            color: var(--blood-glow);
            font-weight: 700;
        }

        .battlefield {
            background: var(--void-deep);
            border: 4px solid var(--blood-fresh);
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 0 60px rgba(139, 0, 0, 0.5),
                inset 0 0 100px rgba(0, 0, 0, 0.8);
        }

        .battlefield::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139, 0, 0, 0.05) 2px, rgba(139, 0, 0, 0.05) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(139, 0, 0, 0.05) 2px, rgba(139, 0, 0, 0.05) 4px);
            pointer-events: none;
        }

        .zone-grid {
            display: grid;
            grid-template-areas: 
                "n1 n1 n2"
                "c c n2"
                "s1 s1 s2";
            height: 100%;
            gap: 3px;
            padding: 15px;
        }

        .zone {
            background: linear-gradient(135deg, var(--void-medium), var(--void-deep));
            border: 2px solid var(--decay-rust);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            position: relative;
            transition: all 0.3s;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .zone::after {
            content: attr(data-zone);
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 0.8em;
            color: var(--text-secondary);
            opacity: 0.3;
            font-weight: 600;
        }

        .zone.center { 
            grid-area: c; 
            background: linear-gradient(135deg, var(--void-light), var(--void-medium));
            border-color: var(--blood-fresh);
        }
        .zone.north1 { grid-area: n1; }
        .zone.north2 { grid-area: n2; }
        .zone.south1 { grid-area: s1; }
        .zone.south2 { grid-area: s2; }

        .agent-token {
            position: absolute;
            width: 100px;
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 2.5em;
            border: 4px solid;
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(0,0,0,0.6));
            box-shadow: 0 0 30px;
            transition: all 0.6s ease;
            clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
        }

        .agent-token::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: inherit;
            filter: blur(10px);
            opacity: 0.5;
            z-index: -1;
        }

        .agent-name {
            font-size: 0.3em;
            margin-top: 5px;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .agent-token.agent1 {
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.9), rgba(255, 23, 68, 0.7));
            border-color: var(--blood-glow);
            color: #fff;
            box-shadow: 0 0 40px var(--blood-glow);
        }

        .agent-token.agent2 {
            background: linear-gradient(135deg, rgba(27, 94, 32, 0.9), rgba(0, 230, 118, 0.7));
            border-color: var(--rot-glow);
            color: #fff;
            box-shadow: 0 0 40px var(--rot-glow);
        }

        .agent-token.dead {
            opacity: 0.2;
            filter: grayscale(100%);
            transform: rotate(90deg);
        }

        .combat-log {
            background: var(--void-deep);
            border: 3px solid var(--decay-rust);
            border-radius: 4px;
            padding: 15px;
            max-height: 180px;
            overflow-y: auto;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .log-entry {
            margin: 6px 0;
            padding: 8px;
            border-left: 4px solid var(--decay-rust);
            padding-left: 12px;
            animation: log-appear 0.3s ease;
            font-weight: 600;
            font-size: 1.05em;
        }

        @keyframes log-appear {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .log-entry.damage { 
            border-left-color: var(--blood-fresh); 
            color: var(--blood-glow);
        }
        
        .log-entry.kill { 
            border-left-color: var(--blood-glow); 
            color: var(--blood-glow);
            font-weight: 700;
            text-shadow: 0 0 10px var(--blood-glow);
        }
        
        .log-entry.action { 
            border-left-color: var(--decay-copper);
            color: var(--text-secondary);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }

        button {
            background: linear-gradient(180deg, var(--blood-fresh), var(--void-deep));
            border: 3px solid var(--blood-fresh);
            color: var(--text-primary);
            padding: 15px 40px;
            font-size: 1.3em;
            font-family: 'Rajdhani', monospace;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            text-shadow: 0 0 10px var(--blood-glow);
            box-shadow: 
                0 0 20px rgba(139, 0, 0, 0.4),
                inset 0 0 10px rgba(255, 23, 68, 0.2);
        }

        button:hover {
            background: linear-gradient(180deg, var(--blood-glow), var(--blood-fresh));
            box-shadow: 0 0 40px var(--blood-glow);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .blood-splatter {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, var(--blood-fresh), var(--blood-fresh) 50%, transparent);
            border-radius: 50%;
            pointer-events: none;
            animation: splatter 1s ease-out forwards;
        }

        @keyframes splatter {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        @keyframes splatter-persist {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0.7; }
        }

        .damage-number {
            position: absolute;
            color: var(--blood-glow);
            font-size: 2.2em;
            font-weight: 700;
            pointer-events: none;
            text-shadow: 
                0 0 10px var(--blood-glow), 
                0 0 20px var(--blood-glow),
                0 0 30px var(--blood-fresh);
            animation: damage-float 1.5s ease-out forwards;
        }

        @keyframes damage-float {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            50% { transform: translateY(-40px) scale(1.3); opacity: 1; }
            100% { transform: translateY(-80px) scale(1); opacity: 0; }
        }

        @keyframes screen-shake {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-6px, 3px); }
            20% { transform: translate(6px, -3px); }
            30% { transform: translate(-4px, 5px); }
            40% { transform: translate(4px, -5px); }
            50% { transform: translate(-3px, 3px); }
            60% { transform: translate(3px, -3px); }
            70% { transform: translate(-2px, 2px); }
            80% { transform: translate(2px, -2px); }
            90% { transform: translate(0, 0); }
        }

        .winner-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, var(--void-black), var(--void-deep));
            border: 6px solid var(--blood-glow);
            padding: 50px;
            border-radius: 8px;
            text-align: center;
            z-index: 1000;
            box-shadow: 
                0 0 100px var(--blood-glow),
                inset 0 0 40px rgba(139, 0, 0, 0.3);
            animation: banner-appear 0.5s ease;
        }

        @keyframes banner-appear {
            from { transform: translate(-50%, -50%) scale(0); }
            to { transform: translate(-50%, -50%) scale(1); }
        }

        .winner-banner h2 {
            font-size: 4em;
            color: var(--blood-glow);
            text-shadow: 
                0 0 30px var(--blood-glow),
                0 0 60px var(--blood-glow);
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 8px;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--void-black);
            border: 1px solid var(--decay-rust);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--blood-fresh);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--blood-glow);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DARKCITY</h1>
            <div class="subtitle">COMBAT ARENA</div>
        </div>

        <div class="arena">
            <div class="agent-panel">
                <h2 id="agent1Name">AGGRESSOR</h2>
                <div class="stat-bar">
                    <div class="stat-label">
                        <span>SOL</span>
                        <span class="value" id="agent1Sol">0.1000</span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill" id="agent1Bar" style="width: 100%"></div>
                    </div>
                </div>
                <div class="stats-grid">
                    <div class="stat-row">
                        <span class="label">KILLS</span>
                        <span class="value" id="agent1Kills">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="label">DAMAGE</span>
                        <span class="value" id="agent1Damage">0.0000</span>
                    </div>
                </div>
            </div>

            <div class="battlefield" id="battlefield">
                <div class="zone-grid">
                    <div class="zone north1" data-zone="NORTH1"></div>
                    <div class="zone north2" data-zone="NORTH2"></div>
                    <div class="zone center" data-zone="CENTER"></div>
                    <div class="zone south1" data-zone="SOUTH1"></div>
                    <div class="zone south2" data-zone="SOUTH2"></div>
                </div>
            </div>

            <div class="agent-panel">
                <h2 id="agent2Name">DEFENDER</h2>
                <div class="stat-bar">
                    <div class="stat-label">
                        <span>SOL</span>
                        <span class="value" id="agent2Sol">0.1000</span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill" id="agent2Bar" style="width: 100%"></div>
                    </div>
                </div>
                <div class="stats-grid">
                    <div class="stat-row">
                        <span class="label">KILLS</span>
                        <span class="value" id="agent2Kills">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="label">DAMAGE</span>
                        <span class="value" id="agent2Damage">0.0000</span>
                    </div>
                </div>
            </div>
        </div>

        <div>
            <div class="combat-log" id="combatLog">
                <div class="log-entry">SYSTEM: Combat arena initialized. Awaiting combatants.</div>
            </div>
            <div class="controls">
                <button onclick="startBattle()">START BATTLE</button>
                <button onclick="resetBattle()">RESET</button>
            </div>
        </div>
    </div>

    <script src="combat-v2.js"></script>
    <script src="viewer.js"></script>
</body>
</html>
