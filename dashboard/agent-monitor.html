<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>darkcity agent monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 20px;
        }
        
        .header h1 {
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff00;
            margin-bottom: 10px;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            border-radius: 5px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }
        
        .stat-label {
            font-size: 0.8em;
            opacity: 0.7;
        }
        
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .agent-card {
            background: rgba(0, 255, 0, 0.05);
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s;
            position: relative;
        }
        
        .agent-card:hover {
            background: rgba(0, 255, 0, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 0, 0.3);
        }
        
        .agent-card.active {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }
        
        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .agent-name {
            font-size: 1.2em;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }
        
        .agent-status {
            padding: 3px 10px;
            border-radius: 3px;
            font-size: 0.8em;
        }
        
        .status-active {
            background: rgba(0, 255, 0, 0.3);
            border: 1px solid #00ff00;
        }
        
        .status-idle {
            background: rgba(255, 255, 0, 0.3);
            border: 1px solid #ffff00;
            color: #ffff00;
        }
        
        .agent-role {
            font-size: 0.9em;
            opacity: 0.7;
            margin-bottom: 10px;
        }
        
        .messages {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
        }
        
        .message {
            margin-bottom: 8px;
            font-size: 0.85em;
            line-height: 1.4;
        }
        
        .message-role {
            color: #00ffff;
            font-weight: bold;
        }
        
        .message-content {
            color: #00ff00;
            margin-left: 10px;
        }
        
        .message-time {
            color: #666;
            font-size: 0.8em;
        }
        
        .no-agents {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            opacity: 0.5;
        }
        
        .last-update {
            text-align: center;
            opacity: 0.5;
            font-size: 0.9em;
            margin-top: 20px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 255, 0, 0.1);
        }
        
        ::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #00ffff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>darkcity agent monitor</h1>
        <div>real-time agent coordination dashboard</div>
    </div>
    
    <div class="status-bar">
        <div class="stat">
            <div class="stat-value" id="total-agents">0</div>
            <div class="stat-label">active agents</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="active-agents">0</div>
            <div class="stat-label">working now</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="total-messages">0</div>
            <div class="stat-label">total messages</div>
        </div>
    </div>
    
    <div class="agents-grid" id="agents-grid">
        <div class="no-agents pulse">waiting for agent data...</div>
    </div>
    
    <div class="last-update" id="last-update">
        last update: never
    </div>
    
    <script>
        let agentData = null;
        
        async function fetchAgentData() {
            try {
                // This will be called by Clawdbot via canvas eval
                return window.__agentData || null;
            } catch (error) {
                console.error('Error fetching agent data:', error);
                return null;
            }
        }
        
        function formatTime(timestamp) {
            if (!timestamp) return 'unknown';
            const date = new Date(timestamp);
            return date.toLocaleTimeString();
        }
        
        function truncate(text, maxLength = 100) {
            if (!text) return '';
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }
        
        function renderAgents(data) {
            if (!data || !data.sessions || data.sessions.length === 0) {
                document.getElementById('agents-grid').innerHTML = 
                    '<div class="no-agents pulse">no active agents found</div>';
                return;
            }
            
            // Update stats
            document.getElementById('total-agents').textContent = data.sessions.length;
            
            const activeCount = data.sessions.filter(s => 
                s.lastMessages && s.lastMessages.length > 0
            ).length;
            document.getElementById('active-agents').textContent = activeCount;
            
            const totalMessages = data.sessions.reduce((sum, s) => 
                sum + (s.lastMessages?.length || 0), 0
            );
            document.getElementById('total-messages').textContent = totalMessages;
            
            // Render agent cards
            const grid = document.getElementById('agents-grid');
            grid.innerHTML = '';
            
            data.sessions.forEach(session => {
                const card = document.createElement('div');
                card.className = 'agent-card';
                
                const hasRecentActivity = session.lastMessages && 
                    session.lastMessages.length > 0 &&
                    session.lastMessages[session.lastMessages.length - 1].timestamp &&
                    (Date.now() - new Date(session.lastMessages[session.lastMessages.length - 1].timestamp).getTime()) < 300000;
                
                if (hasRecentActivity) {
                    card.classList.add('active');
                }
                
                const label = session.label || session.sessionKey?.substring(0, 8) || 'unknown';
                const role = session.kind || 'agent';
                const status = hasRecentActivity ? 'active' : 'idle';
                
                card.innerHTML = `
                    <div class="agent-header">
                        <div class="agent-name">${label}</div>
                        <div class="agent-status status-${status}">${status}</div>
                    </div>
                    <div class="agent-role">${role}</div>
                    <div class="messages" id="messages-${session.sessionKey}">
                        ${renderMessages(session.lastMessages)}
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        function renderMessages(messages) {
            if (!messages || messages.length === 0) {
                return '<div style="opacity: 0.5; text-align: center;">no messages yet</div>';
            }
            
            return messages.slice(-5).map(msg => {
                const role = msg.role || 'system';
                const content = truncate(msg.content || '');
                const time = formatTime(msg.timestamp);
                
                return `
                    <div class="message">
                        <span class="message-role">[${role}]</span>
                        <span class="message-time">${time}</span>
                        <div class="message-content">${content}</div>
                    </div>
                `;
            }).join('');
        }
        
        function updateDisplay() {
            const data = window.__agentData;
            if (data) {
                renderAgents(data);
                document.getElementById('last-update').textContent = 
                    `last update: ${new Date().toLocaleTimeString()}`;
            }
        }
        
        // Initial render
        updateDisplay();
        
        // Auto-update every time new data is pushed
        setInterval(updateDisplay, 100);
    </script>
</body>
</html>
